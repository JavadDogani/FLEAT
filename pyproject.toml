[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fleat-project"
version = "0.1.0"
description = "Modular FLEAT experimental runner for simulation-first federated learning benchmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javad Dogani" }]
requires-python = ">=3.10"
keywords = ["federated learning", "energy efficiency", "edge computing", "pruning", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "torch>=1.12",
  "torchvision>=0.13",
  "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.scripts]
fleat = "fleat_project.main:main"

[project.urls]
Repository = "https://github.com/JavadDogani/FLEAT"
Paper = "https://doi.org/10.1109/TMC.2026.3710334"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["fleat_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the classic default rule set (pyflakes + syntax/runtime-error pycodestyle
# rules) so newer ruff releases do not silently widen what CI enforces.
select = ["E4", "E7", "E9", "F"]
